[build]
  base = "."
  command = "pnpm --filter @workspace/farm2fork build"
  publish = "artifacts/farm2fork/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.34.5"
  PNPM_FLAGS = "--no-frozen-lockfile"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ai/*"
  to = "/.netlify/functions/ai/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
