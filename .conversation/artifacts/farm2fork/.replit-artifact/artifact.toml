kind = "web"
previewPath = "/"
title = "Farm2Fork"
description = "A mobile-first agricultural marketplace connecting farmers and buyers directly, with market intelligence, transparent returns, order tracking, and smart logistics for India."
version = "1.0.0"
id = "artifacts/farm2fork"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23322

[services.development]
run = "pnpm --filter @workspace/farm2fork run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/farm2fork", "run", "build" ]
serve = "static"
publicDir = "artifacts/farm2fork/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23322"
BASE_PATH = "/"
