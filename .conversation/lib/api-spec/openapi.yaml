openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Farm2Fork marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Crop marketplace operations
  - name: orders
    description: Order operations
  - name: insights
    description: AI market intelligence
  - name: logistics
    description: Logistics planning and tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /crops:
    get:
      operationId: listCrops
      tags: [marketplace]
      summary: List available crop lots
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Crop lots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Crop" }
    post:
      operationId: createCrop
      tags: [marketplace]
      summary: Create a crop listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CropInput" }
      responses:
        "201":
          description: Created crop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crop" }
  /crops/{id}:
    get:
      operationId: getCrop
      tags: [marketplace]
      summary: Get a crop listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Crop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crop" }
        "404":
          description: Not found
    patch:
      operationId: updateCrop
      tags: [marketplace]
      summary: Update a crop listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CropUpdate" }
      responses:
        "200":
          description: Updated crop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crop" }
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [farmer, buyer] }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Change order status
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusInput" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [marketplace]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /insights:
    get:
      operationId: getMarketInsights
      tags: [insights]
      summary: Get market intelligence
      responses:
        "200":
          description: Market insights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketInsights" }
  /logistics/plan:
    post:
      operationId: createLogisticsPlan
      tags: [logistics]
      summary: Plan a shipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogisticsPlanInput" }
      responses:
        "200":
          description: Logistics plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogisticsPlan" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Crop:
      type: object
      properties:
        id: { type: number }
        crop: { type: string }
        variety: { type: string }
        category: { type: string }
        farmer: { type: string }
        location: { type: string }
        quantity: { type: number }
        unit: { type: string }
        price: { type: number }
        harvestDate: { type: string }
        grade: { type: string }
        organic: { type: boolean }
        image: { type: string }
        status: { type: string }
      required: [id, crop, variety, category, farmer, location, quantity, unit, price, harvestDate, grade, organic, image, status]
    CropInput:
      type: object
      properties:
        crop: { type: string, minLength: 1 }
        variety: { type: string }
        category: { type: string }
        location: { type: string }
        quantity: { type: number }
        unit: { type: string }
        price: { type: number }
        harvestDate: { type: string }
        grade: { type: string }
        organic: { type: boolean }
      required: [crop, variety, category, location, quantity, unit, price, harvestDate, grade, organic]
    CropUpdate:
      type: object
      properties:
        price: { type: number }
        quantity: { type: number }
        status: { type: string }
    Order:
      type: object
      properties:
        id: { type: number }
        crop: { type: string }
        farmer: { type: string }
        buyer: { type: string }
        quantity: { type: number }
        total: { type: number }
        status: { type: string, enum: [pending, confirmed, in_transit, delivered, cancelled] }
        placedAt: { type: string }
        deliveryDate: { type: string }
        location: { type: string }
      required: [id, crop, farmer, buyer, quantity, total, status, placedAt, deliveryDate, location]
    OrderInput:
      type: object
      properties:
        cropId: { type: number }
        quantity: { type: number }
        buyer: { type: string }
      required: [cropId, quantity, buyer]
    OrderStatusInput:
      type: object
      properties:
        status: { type: string, enum: [pending, confirmed, in_transit, delivered, cancelled] }
      required: [status]
    Dashboard:
      type: object
      properties:
        activeListings: { type: number }
        monthlyEarnings: { type: number }
        pendingOrders: { type: number }
        buyerReach: { type: number }
        averagePriceChange: { type: number }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
      required: [activeListings, monthlyEarnings, pendingOrders, buyerReach, averagePriceChange, recentActivity]
    Activity:
      type: object
      properties:
        id: { type: number }
        title: { type: string }
        description: { type: string }
        time: { type: string }
        type: { type: string }
      required: [id, title, description, time, type]
    MarketInsights:
      type: object
      properties:
        crop: { type: string }
        demand: { type: string }
        demandScore: { type: number }
        estimatedPrice: { type: number }
        priceUnit: { type: string }
        priceChange: { type: number }
        recommendation: { type: string }
        seasonality:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              value: { type: number }
            required: [month, value]
      required: [crop, demand, demandScore, estimatedPrice, priceUnit, priceChange, recommendation, seasonality]
    LogisticsPlanInput:
      type: object
      properties:
        orderIds:
          type: array
          items: { type: number }
        destination: { type: string }
      required: [orderIds, destination]
    LogisticsPlan:
      type: object
      properties:
        distance: { type: number }
        estimatedDays: { type: number }
        estimatedCost: { type: number }
        co2Saved: { type: number }
        stops: { type: number }
        route:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              location: { type: string }
              status: { type: string }
            required: [label, location, status]
      required: [distance, estimatedDays, estimatedCost, co2Saved, stops, route]