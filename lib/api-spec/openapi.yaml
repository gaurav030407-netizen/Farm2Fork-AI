openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Farm2Fork marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Crop marketplace operations
  - name: orders
    description: Order operations
  - name: insights
    description: AI market intelligence
  - name: logistics
    description: Logistics planning and tracking
  - name: farmer-listings
    description: Authenticated farmer crop listing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /crops:
    get:
      operationId: listCrops
      tags: [marketplace]
      summary: List available crop lots
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Crop lots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Crop" }
    post:
      operationId: createCrop
      tags: [marketplace]
      summary: Create a crop listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CropInput" }
      responses:
        "201":
          description: Created crop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crop" }
  /crops/{id}:
    get:
      operationId: getCrop
      tags: [marketplace]
      summary: Get a crop listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Crop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crop" }
        "404":
          description: Not found
    patch:
      operationId: updateCrop
      tags: [marketplace]
      summary: Update a crop listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CropUpdate" }
      responses:
        "200":
          description: Updated crop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Crop" }
  /marketplace/listings:
    get:
      operationId: listMarketplaceListings
      tags: [marketplace]
      summary: List active database crop listings
      responses:
        "200":
          description: Active crop listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FarmerListing" }
  /marketplace/listings/{id}:
    get:
      operationId: getMarketplaceListing
      tags: [marketplace]
      summary: Get an active database crop listing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Active crop listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerListing" }
        "404":
          description: Listing not found
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List the authenticated buyer's orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { description: Authentication required }
        "403": { description: Buyer role required }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order for an active listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { description: Authentication required }
        "403": { description: Buyer role required }
        "409": { description: Listing unavailable or insufficient quantity }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an authorized order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { description: Authentication required }
        "404": { description: Order not found }
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel a pending buyer order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { description: Authentication required }
        "404": { description: Order not found }
        "409": { description: Order cannot be cancelled }
  /farmer/listings:
    get:
      operationId: listFarmerListings
      tags: [farmer-listings]
      summary: List the authenticated farmer's crop listings
      responses:
        "200":
          description: Farmer crop listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FarmerListing" }
        "401":
          description: Authentication required
        "403":
          description: Farmer role required
    post:
      operationId: createFarmerListing
      tags: [farmer-listings]
      summary: Create a crop listing for the authenticated farmer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmerListingInput" }
      responses:
        "201":
          description: Created farmer listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerListing" }
        "400":
          description: Invalid listing
        "401":
          description: Authentication required
        "403":
          description: Farmer role required
  /farmer/listings/{id}:
    get:
      operationId: getFarmerListing
      tags: [farmer-listings]
      summary: Get one listing owned by the authenticated farmer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Farmer listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerListing" }
        "404":
          description: Listing not found
        "401":
          description: Authentication required
        "403":
          description: Farmer role required
    patch:
      operationId: updateFarmerListing
      tags: [farmer-listings]
      summary: Update a listing owned by the authenticated farmer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmerListingUpdate" }
      responses:
        "200":
          description: Updated farmer listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmerListing" }
        "400":
          description: Invalid listing update
        "404":
          description: Listing not found
        "401":
          description: Authentication required
        "403":
          description: Farmer role required
  /farmer/orders:
    get:
      operationId: listFarmerOrders
      tags: [farmer-orders]
      summary: List orders containing the authenticated farmer's listings
      responses:
        "200":
          description: Farmer orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
        "401": { description: Authentication required }
        "403": { description: Farmer role required }
  /farmer/orders/{id}/status:
    patch:
      operationId: updateFarmerOrderStatus
      tags: [farmer-orders]
      summary: Advance an order status as its farmer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusInput" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { description: Authentication required }
        "403": { description: Farmer role required or unauthorized order }
        "409": { description: Invalid status transition }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [marketplace]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /insights:
    get:
      operationId: getMarketInsights
      tags: [insights]
      summary: Get market intelligence
      responses:
        "200":
          description: Market insights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketInsights" }
  /logistics/plan:
    post:
      operationId: createLogisticsPlan
      tags: [logistics]
      summary: Plan a shipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogisticsPlanInput" }
      responses:
        "200":
          description: Logistics plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogisticsPlan" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Crop:
      type: object
      properties:
        id: { type: number }
        crop: { type: string }
        variety: { type: string }
        category: { type: string }
        farmer: { type: string }
        location: { type: string }
        quantity: { type: number }
        unit: { type: string }
        price: { type: number }
        harvestDate: { type: string }
        grade: { type: string }
        organic: { type: boolean }
        image: { type: string }
        status: { type: string }
      required: [id, crop, variety, category, farmer, location, quantity, unit, price, harvestDate, grade, organic, image, status]
    CropInput:
      type: object
      properties:
        crop: { type: string, minLength: 1 }
        variety: { type: string }
        category: { type: string }
        location: { type: string }
        quantity: { type: number }
        unit: { type: string }
        price: { type: number }
        harvestDate: { type: string }
        grade: { type: string }
        organic: { type: boolean }
      required: [crop, variety, category, location, quantity, unit, price, harvestDate, grade, organic]
    CropUpdate:
      type: object
      properties:
        price: { type: number }
        quantity: { type: number }
        status: { type: string }
    FarmerListing:
      type: object
      properties:
        id: { type: string }
        farmer_user_id: { type: [string, "null"] }
        farmer_name: { type: [string, "null"] }
        farmer_photo_url: { type: [string, "null"] }
        crop_name: { type: string }
        variety: { type: [string, "null"] }
        quantity: { type: number }
        unit: { type: string }
        price: { type: number }
        quality: { type: [string, "null"] }
        location: { type: string }
        harvest_date: { type: [string, "null"], format: date }
        image_url: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, SOLD, INACTIVE] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, crop_name, variety, quantity, unit, price, quality, location, harvest_date, image_url, status, created_at, updated_at]
    FarmerListingInput:
      type: object
      properties:
        crop_name: { type: string, minLength: 1, maxLength: 120 }
        variety: { type: [string, "null"], maxLength: 120 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 10000000 }
        unit: { type: string, minLength: 1, maxLength: 32 }
        price: { type: number, minimum: 0, maximum: 100000000 }
        quality: { type: [string, "null"], maxLength: 80 }
        location: { type: string, minLength: 1, maxLength: 160 }
        harvest_date: { type: [string, "null"], format: date }
      required: [crop_name, variety, quantity, unit, price, quality, location, harvest_date]
    FarmerListingUpdate:
      type: object
      properties:
        crop_name: { type: [string, "null"], minLength: 1, maxLength: 120 }
        variety: { type: [string, "null"], maxLength: 120 }
        quantity: { type: [number, "null"], exclusiveMinimum: 0, maximum: 10000000 }
        unit: { type: [string, "null"], minLength: 1, maxLength: 32 }
        price: { type: [number, "null"], minimum: 0, maximum: 100000000 }
        quality: { type: [string, "null"], maxLength: 80 }
        location: { type: [string, "null"], minLength: 1, maxLength: 160 }
        harvest_date: { type: [string, "null"], format: date }
        status: { type: [string, "null"], enum: [ACTIVE, SOLD, INACTIVE] }
    Order:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, PROCESSING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED] }
        total_amount: { type: number }
        delivery_location: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        buyer_name: { type: [string, "null"] }
        farmer_name: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
      required: [id, status, total_amount, delivery_location, created_at, updated_at, items]
    OrderItem:
      type: object
      properties:
        id: { type: string }
        crop_listing_id: { type: string }
        crop_name: { type: string }
        variety: { type: [string, "null"] }
        image_url: { type: [string, "null"] }
        quantity: { type: number }
        unit: { type: string }
        price: { type: number }
        subtotal: { type: number }
      required: [id, crop_listing_id, crop_name, variety, image_url, quantity, unit, price, subtotal]
    OrderInput:
      type: object
      properties:
        crop_listing_id: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        delivery_location: { type: string, minLength: 1, maxLength: 240 }
      required: [crop_listing_id, quantity, delivery_location]
    OrderStatusInput:
      type: object
      properties:
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, PROCESSING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED] }
      required: [status]
    Dashboard:
      type: object
      properties:
        activeListings: { type: number }
        monthlyEarnings: { type: number }
        pendingOrders: { type: number }
        buyerReach: { type: number }
        averagePriceChange: { type: number }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
      required: [activeListings, monthlyEarnings, pendingOrders, buyerReach, averagePriceChange, recentActivity]
    Activity:
      type: object
      properties:
        id: { type: number }
        title: { type: string }
        description: { type: string }
        time: { type: string }
        type: { type: string }
      required: [id, title, description, time, type]
    MarketInsights:
      type: object
      properties:
        crop: { type: string }
        demand: { type: string }
        demandScore: { type: number }
        estimatedPrice: { type: number }
        priceUnit: { type: string }
        priceChange: { type: number }
        recommendation: { type: string }
        seasonality:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              value: { type: number }
            required: [month, value]
      required: [crop, demand, demandScore, estimatedPrice, priceUnit, priceChange, recommendation, seasonality]
    LogisticsPlanInput:
      type: object
      properties:
        orderIds:
          type: array
          items: { type: string }
        destination: { type: string }
      required: [orderIds, destination]
    LogisticsPlan:
      type: object
      properties:
        distance: { type: number }
        estimatedDays: { type: number }
        estimatedCost: { type: number }
        co2Saved: { type: number }
        stops: { type: number }
        route:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              location: { type: string }
              status: { type: string }
            required: [label, location, status]
      required: [distance, estimatedDays, estimatedCost, co2Saved, stops, route]